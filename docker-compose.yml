services:
  db:
    image: postgres:16-alpine
    container_name: pba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pba
      POSTGRES_PASSWORD: pba
      POSTGRES_DB: proofbeforeaction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pba -d proofbeforeaction"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
